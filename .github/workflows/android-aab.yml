# QO'LDA ishga tushiriladi. Imzolangan Android App Bundle (.aab, do'kon uchun) va APK (telefonga o'rnatish uchun) yasaydi.
# Natija parol bilan (AES-256) zip qilinadi: repo ommaviy, artefaktlar hamma uchun ochiq. Ochish: 7-Zip.
# TEKSHIRILMAGAN qoralama: Android SDK bu yerda sinalmagan, birinchi ishga tushirishda xato chiqishi mumkin.
# Kerakli Secrets: docs/SECRETS.md. Imzo kaliti bo'lmasa ish ataylab to'xtaydi (debug imzoli AAB chiqmasin).
name: Android AAB va APK
on:
  workflow_dispatch:
permissions:
  contents: read   # eng kam huquq: workflow repoga yoza olmaydi

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Imzo kalitini joylash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_* Secrets to'liq emas (docs/SECRETS.md)."; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
      - name: Firebase fayli (majburiy)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/write_secret.sh" "$GOOGLE_SERVICES_JSON_B64" android/app/google-services.json json
      - run: flutter pub get
      - run: flutter test --exclude-tags visual --timeout 60s
      - run: flutter build appbundle --release --build-number ${{ github.run_number }} --dart-define=API_BASE_URL=https://samiya-api.davlatsudekspert.workers.dev
      - run: flutter build apk --release --build-number ${{ github.run_number }} --dart-define=API_BASE_URL=https://samiya-api.davlatsudekspert.workers.dev
      - name: AAB va APK'ni parol bilan arxivlash (AES-256)
        env:
          ARTIFACT_PASSPHRASE: ${{ secrets.ARTIFACT_PASSPHRASE }}
        run: |
          if [ -z "$ARTIFACT_PASSPHRASE" ]; then echo "::error::ARTIFACT_PASSPHRASE Secret yo'q (docs/SECRETS.md)"; exit 1; fi
          sudo apt-get install -y -qq p7zip-full
          mkdir -p "$RUNNER_TEMP/out"
          cp build/app/outputs/bundle/release/app-release.aab build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/out/"
          cd "$RUNNER_TEMP/out"
          7z a -tzip -mem=AES256 -p"$ARTIFACT_PASSPHRASE" "$GITHUB_WORKSPACE/samiya-android-${{ github.run_number }}.zip" app-release.aab app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: samiya-android-encrypted-${{ github.run_number }}
          path: samiya-android-${{ github.run_number }}.zip
          retention-days: 7
