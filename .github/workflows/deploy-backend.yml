# QO'LDA ishga tushiriladi. Backend'ni Cloudflare Worker sifatida joylaydi va D1 migratsiyalarini qo'llaydi.
# TEKSHIRILMAGAN qoralama (Cloudflare hisobi hali ulanmagan). Kerakli Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# backend/wrangler.jsonc ichida REPLACE_WITH_D1_ID o'rniga haqiqiy D1 database_id bo'lishi shart.
name: Deploy backend (Cloudflare)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Sozlamalarni tekshirish
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN va CLOUDFLARE_ACCOUNT_ID Secrets kerak (docs/SECRETS.md)"; exit 1
          fi
          if grep -q "REPLACE_WITH_D1_ID" wrangler.jsonc; then
            echo "::error::wrangler.jsonc da D1 database_id hali qo'yilmagan"; exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: D1 migratsiyalari (masofadagi baza)
        run: npx wrangler d1 migrations apply samiya --remote
      - name: Deploy
        run: |
          npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/deploy.txt"
      - name: Tekshiruv (/health)
        run: |
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' "$RUNNER_TEMP/deploy.txt" | head -1)"
          if [ -z "$url" ]; then echo "::warning::workers.dev manzili logdan topilmadi"; exit 0; fi
          echo "Manzil: $url"
          curl -fsS --retry 5 --retry-delay 5 "$url/health"
          curl -fsS "$url/api/v1/config/public"
