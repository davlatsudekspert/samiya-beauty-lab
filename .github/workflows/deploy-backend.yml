# QO'LDA ishga tushiriladi. Backend'ni Cloudflare Worker sifatida joylaydi va D1 migratsiyalarini qo'llaydi.
# TEKSHIRILMAGAN qoralama (Cloudflare hisobi hali ulanmagan). Kerakli Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# D1 'samiya' bazasi topiladi (yo'q bo'lsa yaratiladi), uning ID'si faqat CI ichida wrangler.jsonc ga yoziladi.
name: Deploy backend (Cloudflare)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Sozlamalarni tekshirish
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN Secret bo'sh yoki topilmadi (Repository secrets ichida, aynan shu nom bilan)"; missing=1; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::CLOUDFLARE_ACCOUNT_ID Secret bo'sh yoki topilmadi (Repository secrets ichida, aynan shu nom bilan)"; missing=1; fi
          [ "$missing" = 0 ] || exit 1
          echo "Secrets mavjud (uzunliklar: token ${#CLOUDFLARE_API_TOKEN}, account ${#CLOUDFLARE_ACCOUNT_ID})"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: D1 bazasini topish yoki yaratish va wrangler.jsonc ga (faqat CI ichida) yozish
        run: |
          find_id() {
            npx wrangler d1 list --json > "$RUNNER_TEMP/d1.txt" 2>/dev/null || true
            python3 - "$RUNNER_TEMP/d1.txt" <<'PY'
          import json, sys
          t = open(sys.argv[1], encoding="utf-8").read()
          i = t.find("[")
          data = json.JSONDecoder().raw_decode(t[i:])[0] if i >= 0 else []
          print(next((x["uuid"] for x in data if x.get("name") == "samiya"), ""))
          PY
          }
          ID="$(find_id)"
          if [ -z "$ID" ]; then
            echo "D1 'samiya' topilmadi, yaratilmoqda"
            npx wrangler d1 create samiya --location eeur || npx wrangler d1 create samiya
            ID="$(find_id)"
          fi
          if [ -z "$ID" ]; then echo "::error::D1 'samiya' ID'si aniqlanmadi (token'ga D1 Edit ruxsati bormi?)"; exit 1; fi
          echo "D1 database_id aniqlandi"
          sed -i "s/REPLACE_WITH_D1_ID/$ID/" wrangler.jsonc
      - name: D1 migratsiyalari (masofadagi baza)
        run: npx wrangler d1 migrations apply samiya --remote
      - name: Deploy
        run: |
          npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/deploy.txt"
      - name: Tekshiruv (/health)
        run: |
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' "$RUNNER_TEMP/deploy.txt" | head -1)"
          if [ -z "$url" ]; then echo "::warning::workers.dev manzili logdan topilmadi"; exit 0; fi
          echo "Manzil: $url"
          curl -fsS --retry 5 --retry-delay 5 "$url/health"
          curl -fsS "$url/api/v1/config/public"
