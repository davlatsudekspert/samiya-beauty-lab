# QO'LDA ishga tushiriladi (PULLIK macOS daqiqalari ketadi). TestFlight'ga imzolangan IPA yuklaydi.
# TEKSHIRILMAGAN qoralama: Mac bu yerda yo'q, imzolash (API kaliti bilan avtomatik) birinchi ishga tushirishda
# sozlashni talab qilishi mumkin. App Store review'ga YUBORMAYDI. Secrets: docs/SECRETS.md.
name: iOS TestFlight
on:
  workflow_dispatch:
permissions:
  contents: read   # eng kam huquq: workflow repoga yoza olmaydi

jobs:
  testflight:
    runs-on: macos-26   # Xcode 26.x (Firebase uchun Swift 6.2 va Apple'ning yangi SDK talabi)
    timeout-minutes: 60
    env:
      TEAM_ID: 5Z9CT2W378
      BUNDLE_ID: uz.samiya.beautylab
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets tekshiruvi
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_B64; do
            if [ -z "${!v}" ]; then echo "::error::$v Secret yo'q (docs/SECRETS.md)"; exit 1; fi
          done
          if ! echo "$ASC_ISSUER_ID" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "::error::ASC_ISSUER_ID UUID formatida emas (8-4-4-4-12). Apple sahifasidan aniq nusxalang."; exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: API kalitini joylash va tekshirish
        run: |
          # Nusxalashda tushgan ko'rinmas bo'shliq/qator ajratgichlarni olib tashlaymiz
          KEY_ID="$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')"
          ISSUER="$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')"
          echo "ASC_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ISSUER" >> "$GITHUB_ENV"
          echo "Key ID uzunligi: ${#KEY_ID} (kutilgan: 10), Issuer uzunligi: ${#ISSUER} (kutilgan: 36)"
          KEY="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          mkdir -p "$(dirname "$KEY")"
          .github/scripts/write_secret.sh "$ASC_KEY_P8_B64" "$KEY"
          echo "Kalit fayli birinchi qatori: $(head -1 "$KEY")"   # sarlavha qatori maxfiy emas
          if openssl pkcs8 -in "$KEY" -nocrypt -out /dev/null 2>/dev/null; then
            echo "Kalit formati to'g'ri (PKCS#8)"
          else
            echo "::error::ASC_KEY_P8_B64 yaroqli .p8 kalit emas (fayl to'liq nusxalanmagan yoki boshqa fayl)"; exit 1
          fi
      - name: Firebase fayli (majburiy)
        env:
          PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          .github/scripts/write_secret.sh "$PLIST_B64" mobile/ios/Runner/GoogleService-Info.plist xml
      - name: Xcode versiyasi
        run: xcodebuild -version
      - name: Flutter tayyorlash
        working-directory: mobile
        run: |
          flutter pub get
          flutter test --exclude-tags visual --timeout 60s
          flutter build ios --release --no-codesign --build-number ${{ github.run_number }} --dart-define=API_BASE_URL=https://samiya-api.davlatsudekspert.workers.dev
      - name: Arxiv (imzolash Apple API kaliti bilan, avtomatik)
        working-directory: mobile/ios
        run: |
          xcodebuild archive -workspace Runner.xcworkspace -scheme Runner -configuration Release \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: IPA eksporti
        working-directory: mobile/ios
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: TestFlight'ga yuklash
        run: |
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP"/ipa/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
